<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: when the on-screen keyboard opens, shrink the
         viewport (and dvh) to the space above it, so a dvh-sized modal and its
         Add button stay above the keyboard instead of being covered by it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#121214" />
    <meta
      name="description"
      content="Campus Coin - a budget and expense tracker built for university students. Log income and spending, set budgets, and get saving tips from your own history."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist sets headings and figures - cut for a dashboard, not adapted from
         a text face, so tracked-down sizes like the KPI numbers stay crisp
         instead of touching at tight letter-spacing. Inter carries the
         reading: paragraphs, labels, table rows - the job it is drawn for. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Campus Coin</title>
    <!-- The loader. Written here, not in the app's stylesheets, so it paints
         the moment the page arrives - before any JavaScript - and the React
         loader (src/components/Loader.jsx) uses the same classes, so the two
         join up without a flash. -->
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.9rem;
        background: #121214;
        color: #fff;
        font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
        animation: app-loader-in 0.3s ease-out;
      }
      .app-loader-mark { position: relative; display: grid; place-items: center; width: 104px; height: 104px; perspective: 700px; }
      /* The coin flips: two turns, then it rests face-on long enough to be read.
         Edge-on it all but disappears, which is what sells it as a coin. */
      .app-loader-mark > svg:last-child {
        transform-style: preserve-3d;
        backface-visibility: visible;
        animation: app-loader-flip 2.6s cubic-bezier(0.45, 0.05, 0.25, 1) infinite;
      }
      .app-loader-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
      .app-loader-ring circle { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 4; }
      .app-loader-ring .is-run {
        stroke: #22c55e;
        stroke-linecap: round;
        stroke-dasharray: 26 74;
        animation: app-loader-run 1.1s linear infinite;
      }
      .app-loader-name { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; margin-top: 0.4rem; }
      .app-loader-line {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        font-size: 0.9rem;
        color: #a1a1aa;
        animation: app-loader-in 0.35s ease-out;
      }
      .app-loader-line i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #22c55e;
        animation: app-loader-dot 1.2s ease-in-out infinite;
      }
      .app-loader-line i:first-of-type { margin-left: 3px; }
      .app-loader-line i:nth-of-type(2) { animation-delay: 0.15s; }
      .app-loader-line i:nth-of-type(3) { animation-delay: 0.3s; }
      @keyframes app-loader-run { to { stroke-dashoffset: -100; } }
      @keyframes app-loader-flip {
        0% { transform: rotateY(0deg) translateY(0); }
        30% { transform: rotateY(360deg) translateY(-6px); }
        60% { transform: rotateY(720deg) translateY(0); }
        100% { transform: rotateY(720deg) translateY(0); }
      }
      @keyframes app-loader-dot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
      @keyframes app-loader-in { from { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader *, .app-loader { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app as soon as it starts. -->
      <div class="app-loader" role="status" aria-live="polite">
        <div class="app-loader-mark">
          <svg class="app-loader-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="46" />
            <circle class="is-run" cx="50" cy="50" r="46" pathLength="100" />
          </svg>
          <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="lm" x1="0.15" y1="0" x2="0.85" y2="1">
                <stop offset="0" stop-color="#6ee7b7" />
                <stop offset="0.5" stop-color="#22c55e" />
                <stop offset="1" stop-color="#15803d" />
              </linearGradient>
            </defs>
            <circle cx="24" cy="24" r="24" fill="url(#lm)" />
            <path d="M32.5 15.5A12 12 0 1 0 32.5 32.5" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" />
            <circle cx="24" cy="24" r="3.4" fill="#fff" />
          </svg>
        </div>
        <strong class="app-loader-name">Campus Coin</strong>
        <span class="app-loader-line">Getting things ready<i></i><i></i><i></i></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
